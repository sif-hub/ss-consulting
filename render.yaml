databases:
  - name: ss-consulting-db
    plan: free
    databaseName: ss_consulting_db
    user: ss_consulting

services:
  - type: web
    name: ss-consulting-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: >
      alembic upgrade head &&
      python -m app.seeds.run_seed &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ss-consulting-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: DEBUG
        value: "False"
      - key: ENVIRONMENT
        value: production
      # À renseigner manuellement dans le tableau de bord Render
      # (Environment) après le premier déploiement :
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: NOTCHPAY_PUBLIC_KEY
        sync: false
      - key: NOTCHPAY_PRIVATE_KEY
        sync: false
      - key: NOTCHPAY_HASH_KEY
        sync: false
      - key: NOTCHPAY_BASE_URL
        value: https://api.notchpay.co
      - key: NOTCHPAY_CALLBACK_URL
        sync: false
      - key: PAYMENT_COMMISSION_RATE
        value: "2.0"
      - key: PAYMENT_COMMISSION_ACCOUNT
        value: "657288777"
